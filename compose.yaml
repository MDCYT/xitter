services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xitter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-xitter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xitter} -d ${POSTGRES_DB:-xitter}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xitter-net

  xitter:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://x.glitchprod.xyz}
      DATABASE_URL: postgres://${POSTGRES_USER:-xitter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xitter}
      ADMIN_ANY_IP: ${ADMIN_ANY_IP:-1}
      SOURCE_URL: ${SOURCE_URL:-https://github.com/MDCYT/xitter}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      LOG_REQUESTS: ${LOG_REQUESTS:-}
      RATE_LIMITS: ${RATE_LIMITS:-}
      JUICEBOX_URL: http://realm:8580
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT_HOST:-3005}:3000"
    volumes:
      - xitter_client:/app/client
      - xitter_media:/app/media
      - xitter_data:/app/data
    networks:
      - xitter-net

  # Juicebox realm for chat passcode recovery (see deploy/juicebox)
  realm:
    profiles: ["keybackup"]
    build: deploy/juicebox
    restart: unless-stopped
    command: ["-provider", "postgres", "-port", "8580"]
    environment:
      DATABASE_URL: postgres://juicebox:${REALM_DB_PASSWORD:-realm}@realm-db:5432/juicebox
      REALM_ID: ${JUICEBOX_REALM_ID:-}
      TENANT_SECRETS: '{"xitter":{"1":"${JUICEBOX_TENANT_SECRET:-}"}}'
    depends_on:
      realm-db:
        condition: service_healthy
    networks:
      - xitter-net

  realm-db:
    profiles: ["keybackup"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: juicebox
      POSTGRES_DB: juicebox
      POSTGRES_PASSWORD: ${REALM_DB_PASSWORD:-realm}
    volumes:
      - realm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juicebox -d juicebox"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - xitter-net

volumes:
  postgres_data:
  xitter_client:
  xitter_media:
  xitter_data:
  realm-db:

networks:
  xitter-net:
    driver: bridge
